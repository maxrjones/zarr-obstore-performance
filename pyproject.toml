[project]
name = "benchmark"
version = "0.1.0"
description = "Simple tests on using Zarr-Python with obstore"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
 "ipython",
 "zarr==3.0.8",
 "xarray==2025.04.0",
 "rich>=13.9.4",
 "obstore==0.6.0",
 "fsspec",
 "s3fs",
 "gcsfs",
 "matplotlib>=3.10.1",
]
[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ruff>=0.9.7",
    "pyinstrument>=5.0.2",
]
pc = [
    "adlfs>=2024.12.0",
    "cubed>=0.21.0",
    "dask>=2025.5.1",
    "planetary-computer>=1.0.0",
    "pystac-client>=0.8.6",
]

[tool.uv.sources]
obstore = { git = "https://github.com/developmentseed/obstore", subdirectory="obstore" }

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP", "N", "S", "ERA", "PD", "EXE", "PGH"]
